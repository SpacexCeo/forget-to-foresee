[package]
name = "skin-nft"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Forget to Foresee (NEAR testnet): a capped NFT skin series (the wheel's grand prize), one per account."
repository = "https://github.com/SpacexCeo/forget-to-foresee"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[target.'cfg(not(any(windows, target_family = "wasm")))'.dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
