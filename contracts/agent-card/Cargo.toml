[package]
name = "agent-card"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Forget to Foresee: the agent card, a NEP-171 NFT of an agent's end-of-season state tied to a committed season (NEAR testnet)."
repository = "https://github.com/SpacexCeo/forget-to-foresee"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

# Native host tests: near-sdk's mocked blockchain (src/tests.rs) and sandbox integration tests (tests/sandbox.rs).
# Both pull C dependencies and the NEAR sandbox node has no Windows build, so they are skipped on Windows and on the
# wasm32-wasip1 target, where only the pure tests (src/vector_tests.rs) run.
[target.'cfg(not(any(windows, target_family = "wasm")))'.dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
