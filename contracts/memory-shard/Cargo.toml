[package]
name = "memory-shard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Forget to Foresee: memory shards as NEP-171 NFTs tied to a committed season (NEAR testnet)."
repository = "https://github.com/SpacexCeo/forget-to-foresee"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[target.'cfg(not(any(windows, target_family = "wasm")))'.dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
