[package]
name = "season-commit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Forget to Foresee: season schedule commitment, on-chain Merkle reveal verification and Ash's key commit-reveal (NEAR testnet)."
repository = "https://github.com/SpacexCeo/forget-to-foresee"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

# Native host tests: near-sdk's mocked blockchain (src/tests.rs) and sandbox integration
# tests (tests/sandbox.rs). Both pull C dependencies (aws-lc-sys, blst, secp256k1-sys) and the
# NEAR sandbox node has no Windows build, so they are skipped on Windows and on the
# wasm32-wasip1 target, where only the pure tests (src/vector_tests.rs) run.
[target.'cfg(not(any(windows, target_family = "wasm")))'.dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"


[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true