# Builds the season-commit contract and runs every test tier on Linux:
# vectors vs engine.js, pure tests, near-sdk mocked-blockchain tests, sandbox integration tests.
name: contracts

on:
  push:
    paths:
      - 'contracts/**'
      - 'game/src/game/**'
      - 'game/src/net/shard-nft.js'
      - 'game/scripts/gen-contract-vectors.mjs'
      - 'game/scripts/gen-shard-vectors.mjs'
      - 'game/tests/contract-vectors.test.mjs'
      - 'game/tests/client/shard-nft.test.mjs'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'game/src/game/**'
      - '.github/workflows/contracts.yml'

jobs:
  season-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: contracts/season-commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vectors match engine.js and crypto.js
        working-directory: game
        run: node --test tests/contract-vectors.test.mjs
      - name: Rust toolchain
        run: rustup show && rustc --version
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Unit, mocked-blockchain and sandbox tests
        shell: bash
        run: |
          set +e
          cargo test -- --test-threads=2 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Surface results as check-run annotations (readable without downloading logs).
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          results=$(grep -E "^test result:|Running " test.log | enc)
          echo "::notice title=cargo test results::$results"
          if [ "$status" -ne 0 ]; then
            details=$(grep -nE "^error|panicked|FAILED|left:|right:|-->|^failures:|^    [a-z_]+::" test.log | head -150 | enc)
            echo "::error title=cargo test failed::$details"
          fi
          exit $status
  memory-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/memory-shard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shard vectors match shard-nft.js
        working-directory: game
        run: npm ci && node --test tests/client/shard-nft.test.mjs
      - name: Rust toolchain
        run: rustup show && rustc --version
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Vector and mocked-blockchain tests
        run: cargo test --lib
