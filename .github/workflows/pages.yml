# Builds the browser game (game/) and publishes it to GitHub Pages:
# https://spacexceo.github.io/forget-to-foresee/  (judges: /?demo=judge)
# The owner's own domain is one repository variable: Settings -> Secrets and variables -> Actions -> Variables ->
# FTF_DOMAIN = play.example.com (then Settings -> Pages -> Custom domain, the same name). The build then serves from "/",
# every public link and og: tag points to https://<domain>/ and a CNAME file ships. FTF_BASE / FTF_SITE_URL override
# each part alone (game/build/site.js). The relayer and presence servers take the new origin in FTF_ALLOWED_ORIGINS.
# The whole season runs in the browser (same room code as the agent API), so a static host is enough.
# One-time setup by the repository owner: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTF_DOMAIN: ${{ vars.FTF_DOMAIN }}
      FTF_BASE: ${{ vars.FTF_BASE || (vars.FTF_DOMAIN && '/') || '/forget-to-foresee/' }}
      FTF_SITE_URL: ${{ vars.FTF_SITE_URL }}
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - name: Tests (rules parity, HUD, play layer)
        run: npm test
      - name: Build for the Pages path (FTF_BASE above)
        run: npm run build
        env:
          # Day 1: the relayer that signs create_guest server-side (relayer/); no key is built into the page
          VITE_FTF_RELAYER_URL: ${{ vars.FTF_RELAYER_URL }}
          # the NEAR network (game/src/net/network.js): unset or anything but 'mainnet' builds the testnet game
          VITE_FTF_NEAR_NETWORK: ${{ vars.FTF_NEAR_NETWORK }}
      - name: Smoke the built page (fails on any page error or a stuck loading screen)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort --host 127.0.0.1 > /tmp/preview.log 2>&1 &)
          sleep 4
          node scripts/smoke-built.mjs "http://127.0.0.1:4173${FTF_BASE}?day1=0&quest=0" 300 # the preview serves the path the build was made for
      - name: CNAME for the owner's domain (only when FTF_DOMAIN is set)
        if: ${{ vars.FTF_DOMAIN != '' }}
        run: echo "$FTF_DOMAIN" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
