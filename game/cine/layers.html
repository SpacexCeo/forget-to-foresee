<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Layers pass</title>
<!-- The CPU layers pass (tools/capture/layers-pass.mjs): draws a shot's depth-anchored data layers from the camera recorded
     during its GPU capture, on a transparent page, frame by frame. Dev server only; not a build input. -->
<style>html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}#cine{position:fixed;inset:0}</style>
</head><body><img id="plate" alt="" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover"><div id="vig" style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(6,10,10,.55) 100%)"></div><div id="cine"></div><script type="module" src="./layers-page.js"></script></body></html>
