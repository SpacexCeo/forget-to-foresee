<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The web fonts never block the first paint: the stylesheet loads as print media and switches to all when it arrives (font-display: swap). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@300;400&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@300;400&display=swap"></noscript>
  <link rel="preload" as="image" href="/assets/ui/lobby_bg.jpg" fetchpriority="high">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forget to Foresee</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --ink: #e9efe9; --panel: rgba(20, 24, 22, 0.72); --amber: #d9a441; --muted: #a9b5ae; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d3d0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); }
    #app, #app canvas { position: fixed; inset: 0; display: block; }
    /* ---- the first seconds: an inline loading screen that paints before any script (docs/first-seconds.md) ---- */
    #boot { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #22282a 0%, #141a1c 58%, #0c1113 100%); color: #ece6da; font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; }
    #boot .boot-inner { display: grid; justify-items: center; gap: 22px; transform: translateY(-4vh); }
    #boot .boot-title { margin: 0; font-weight: 300; letter-spacing: .32em; font-size: clamp(1.1rem, 2.6vw, 1.7rem); line-height: 1.35; text-align: center; text-indent: .32em; color: #efe9df; }
    #boot .boot-title span { display: block; }
    #boot .boot-ring { width: 128px; height: 128px; display: block; overflow: visible; }
    #boot .boot-ring-bg { fill: none; stroke: rgba(236,230,218,.14); stroke-width: 1.5; }
    #boot .boot-ring-fg { fill: none; stroke: #e4c272; stroke-width: 2; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; stroke-dasharray: 339.29; stroke-dashoffset: 339.29; filter: drop-shadow(0 0 6px rgba(228,194,114,.45)); transition: stroke-dashoffset 240ms cubic-bezier(.16, 1, .3, 1); }
    #boot .boot-ring-ink { fill: none; stroke: rgba(236,230,218,.55); stroke-width: 1; stroke-dasharray: 2 7; animation: boot-breathe 2.4s ease-in-out infinite; transform-origin: 50% 50%; }
    #boot .boot-core { fill: #e4c272; opacity: .9; animation: boot-core 2.4s ease-in-out infinite; transform-origin: 50% 50%; }
    #boot .boot-meta { display: flex; gap: 14px; align-items: baseline; font: 400 12px/1 system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: rgba(236,230,218,.62); }
    #boot .boot-pct { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; color: #e4c272; }
    #boot.boot--failed .boot-label { color: #ff8a7a; letter-spacing: .04em; text-transform: none; }
    @keyframes boot-breathe { 0%, 100% { transform: scale(.94) rotate(0deg); opacity: .5; } 50% { transform: scale(1.02) rotate(12deg); opacity: .9; } }
    @keyframes boot-core { 0%, 100% { transform: scale(.85); opacity: .55; } 50% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot .boot-ring-ink, #boot .boot-core { animation: none; } #boot .boot-ring-fg { transition: none; } }
    html[data-motion="reduce"] #boot .boot-ring-ink, html[data-motion="reduce"] #boot .boot-core { animation: none; }
    body.booting #badge { display: none; }
    .panel { position: fixed; background: var(--panel); border-radius: 8px; padding: 8px 12px; pointer-events: none; }
    #objective { position: fixed; top: 14px; left: 18px; max-width: calc(100% - 175px); font: 500 18px/1.3 Georgia, serif; pointer-events: none; }
    #scene-controls { z-index: 11; }
    body:not(.in-world) #scene-controls { display: none; }
    .ftf-scene-cue { bottom: 240px; }
    #hud { top: 48px; left: 12px; font: 12px/1.45 ui-monospace, Consolas, monospace; max-width: min(560px, calc(100vw - 48px)); }
    #hud .over { color: #ff8a7a; }
    #hud .assets { margin-top: 6px; columns: 2; column-gap: 18px; color: var(--muted); }
    #hud .st-loaded { color: #9fd89a; } #hud .st-loading { color: var(--amber); } #hud .st-failed { color: #ff8a7a; }
    #hud .events { margin-top: 6px; color: var(--muted); }
    #prompt { bottom: 200px; left: 50%; transform: translateX(-50%); font-size: 16px; white-space: nowrap; background: rgba(20, 24, 22, 0.45); }
    #prompt kbd { font-size: 14px; padding: 1px 7px; margin-right: 6px; }
    #toast { bottom: 76px; left: 50%; transform: translateX(-50%); color: var(--muted); }
    kbd { border: 1px solid #6c7a72; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, Consolas, monospace; color: var(--ink); }
    #badge { bottom: 12px; left: 12px; font-size: 12px; color: var(--muted); }
    body.in-world #badge { display: none; }
    /* Lobby/onboarding (src/ui) and the in-world UI share one overlay; in the world only panels take input. */
    #ui { position: fixed; inset: 0; z-index: 10; }
    body:not(.in-world) #ui { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; } /* lobby/onboarding pages taller than the screen scroll */
    body.in-world #ui { pointer-events: none; }
    /* World HUD (src/play/world-hud.js): it replaces the goal card, chronicle, action bar and the old status/subtitles;
       the play panels, context menu, help and info stay above it. ?hud=old keeps the greybox overlay. */
    .wh-host { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    body.wh-on .pl-goal, body.wh-on .pl-chronicle, body.wh-on .pl-bar, body.wh-on #ui .ftf-hud-status, body.wh-on #ui .ftf-subtitles { display: none !important; }
    body.wh-on .pl-panel, body.wh-on .pl-context, body.wh-on .pl-help, body.wh-on .pl-info { z-index: 2; }
    body.wh-on .pl-badge { top: auto; bottom: 8px; left: 16px; right: auto; max-width: min(380px, 30vw); z-index: 1; }
    body.wh-on .ftf-scene-tools { display: none; } /* the hotbar's Settings and Esc open the same menu */
    body.wh-on .ftf-scene-cue, body.wh-on #prompt { bottom: 22vh; }
    @media (max-width: 700px) { body.wh-on .pl-badge { display: none; } }
    body.in-world #ui .ftf-hud-chronicle { display: none; } /* the play chronicle renders the room log (docs/collab-requests.md) */
    #ui .ftf-hud { position: fixed; inset: 0; pointer-events: none; }
    .pl-goal, .pl-context, .pl-panel, .pl-chronicle, .pl-help, .pl-bar, .pl-info, .pl-badge { position: fixed; pointer-events: auto; background: var(--panel); border-radius: 10px; color: var(--ink); box-shadow: 0 6px 24px rgba(10, 14, 12, 0.35); }
    .pl-goal { top: 14px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 10px 16px 12px; border-top: 3px solid var(--amber); }
    .pl-goal-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .pl-goal-title { margin: 4px 0 2px; font: 600 19px/1.3 Georgia, 'Times New Roman', serif; color: #f6efdc; }
    .pl-goal-hint { margin: 0 0 6px; font-size: 13px; color: #cdd6d0; }
    .pl-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    .pl-btn { font: 13px/1.2 system-ui, sans-serif; color: var(--ink); background: rgba(44, 52, 48, 0.9); border: 1px solid #5d6b63; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    .pl-btn:hover { border-color: var(--amber); } .pl-btn:focus-visible, .pl-opt:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
    .pl-btn[disabled] { opacity: 0.5; cursor: default; }
    .pl-primary { background: #6b4f1e; border-color: var(--amber); color: #fff6e0; }
    .pl-small { padding: 3px 8px; font-size: 12px; }
    .pl-context { bottom: 74px; left: 50%; transform: translateX(-50%); padding: 8px 12px; min-width: 300px; max-width: min(620px, calc(100vw - 32px)); }
    .pl-context h3 { margin: 0 0 6px; font: 600 15px Georgia, serif; color: #f6efdc; }
    .pl-context ol { list-style: none; margin: 0; padding: 0; }
    .pl-opt { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: 14px/1.35 system-ui, sans-serif; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
    .pl-opt:hover, .pl-default { background: rgba(217, 164, 65, 0.18); }
    .pl-default kbd { border-color: var(--amber); color: var(--amber); }
    .pl-off { opacity: 0.55; } .pl-off small { color: #ffb4a8; }
    .pl-panel { top: 120px; right: 16px; width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 220px); overflow: auto; padding: 12px 16px; }
    .pl-panel header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .pl-panel h2 { margin: 0; font: 600 17px Georgia, serif; color: #f6efdc; } .pl-panel h3 { font: 600 14px Georgia, serif; margin: 10px 0 4px; }
    .pl-list { list-style: none; padding: 0; margin: 8px 0; } .pl-list > li { padding: 8px 0; border-top: 1px solid rgba(160, 175, 168, 0.2); }
    .pl-mem-head { display: flex; justify-content: space-between; gap: 8px; }
    .pl-muted { color: var(--muted); font-size: 13px; } .pl-strong { color: #f6d58a; font-weight: 600; }
    .pl-sign { display: grid; grid-template-columns: 112px 1fr; gap: 10px; } .pl-sign canvas { border-radius: 8px; }
    .pl-slots { margin: 2px 0; padding-left: 16px; font-size: 13px; }
    .pl-tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--amber); border-radius: 10px; color: var(--amber); }
    .pl-pick { margin: 6px 0; } .pl-pick > span { font-size: 12px; color: var(--muted); }
    .pl-chronicle { left: 12px; bottom: 12px; width: min(380px, calc(100vw - 32px)); margin: 0; padding: 8px 10px; list-style: none; font-size: 12px; max-height: 180px; overflow: hidden; }
    .pl-chronicle li { display: flex; gap: 6px; padding: 1px 0; } .pl-chronicle .pl-t { color: var(--muted); min-width: 16px; text-align: right; }
    .pl-chronicle [data-tone=good] .pl-glyph { color: #9fd89a; } .pl-chronicle [data-tone=bad] .pl-glyph { color: #ff8a7a; } .pl-chronicle [data-tone=key] .pl-glyph { color: var(--amber); }
    .pl-bar { right: 12px; bottom: 12px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 420px); }
    .pl-help { top: 120px; left: 12px; width: 320px; padding: 10px 14px; font-size: 13px; } .pl-help p { margin: 4px 0; }
    .pl-info { bottom: 180px; left: 50%; transform: translateX(-50%); padding: 8px 14px; font-size: 14px; }
    .pl-badge { top: 14px; right: 12px; max-width: 250px; padding: 6px 10px; font-size: 11px; color: var(--muted); background: rgba(20, 24, 22, 0.5); }
    @media (max-width: 900px) { .pl-bar { max-width: none; left: 12px; } .pl-chronicle { display: none; } .pl-badge { display: none; } }

    /* Phones: miniature HUD so the world stays visible (owner 07.11). */
    @media (max-width: 640px), (pointer: coarse) and (max-height: 900px) {
      .pl-goal { top: calc(6px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 132px)); left: auto; right: 8px; transform: none; padding: 5px 9px 6px; border-top-width: 2px; border-radius: 8px; }
      .pl-goal-head { font-size: 9px; } .pl-goal-title { font-size: 13px; margin: 2px 0; } .pl-goal-hint { display: none; }
      .pl-row { gap: 4px; margin-top: 3px; }
      .pl-btn { font-size: 11px; padding: 4px 7px; border-radius: 5px; } .pl-small { font-size: 10px; padding: 2px 6px; }
      .pl-bar { left: 6px; right: 6px; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding: 4px; gap: 4px; max-width: none; justify-content: center; border-radius: 8px; }
      .pl-context { bottom: calc(46px + env(safe-area-inset-bottom, 0px)); min-width: 0; width: calc(100vw - 16px); padding: 5px 8px; }
      .pl-context h3 { font-size: 12px; margin-bottom: 3px; } .pl-opt { font-size: 12px; padding: 3px 4px; }
      .pl-panel { top: auto; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); right: 8px; left: 8px; width: auto; max-height: 50vh; padding: 8px 10px; font-size: 12px; }
      .pl-panel h2 { font-size: 14px; } .pl-panel h3 { font-size: 12px; } .pl-muted { font-size: 11px; }
      .pl-help { top: auto; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); left: 8px; width: calc(100vw - 16px); font-size: 11px; padding: 6px 10px; }
      .pl-info { bottom: calc(50px + env(safe-area-inset-bottom, 0px)); font-size: 12px; padding: 5px 10px; max-width: calc(100vw - 24px); }
      .pl-chronicle, .pl-badge, #badge, #prompt { display: none !important; }
      #ui .ftf-hud-status { top: calc(6px + env(safe-area-inset-top, 0px)) !important; left: 6px !important; right: auto !important; width: 190px !important; min-width: 0 !important; grid-template-columns: 1fr !important; gap: 0 !important; padding: 8px 10px !important; transform: scale(.58); transform-origin: top left; }
      #toast { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); font-size: 12px; }
    }
  </style>
</head>
<body class="booting">
  <div id="boot" role="status" aria-live="polite" aria-label="Loading">
    <div class="boot-inner">
      <svg class="boot-ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="boot-ring-bg" cx="60" cy="60" r="54"/>
        <circle class="boot-ring-ink" cx="60" cy="60" r="46"/>
        <circle class="boot-ring-fg" cx="60" cy="60" r="54"/>
        <circle class="boot-core" cx="60" cy="60" r="3.5"/>
      </svg>
      <h1 class="boot-title"><span>Forget</span><span>to Foresee</span></h1>
      <div class="boot-meta"><span class="boot-label">Loading the island</span><span class="boot-pct">4%</span></div>
    </div>
  </div>
  <script>
    // Before the module graph arrives: a slow trickle on the ring, so the first second is never a frozen bar.
    (function () {
      var ring = document.querySelector('#boot .boot-ring-fg'), pct = document.querySelector('#boot .boot-pct'), p = 0.04, C = 339.29, t0 = Date.now();
      window.__ftfBoot = { shown: function () { return p; }, stop: function () { clearInterval(id); } };
      var id = setInterval(function () {
        if (!document.getElementById('boot')) { clearInterval(id); return; }
        p = Math.min(0.3, 0.04 + (Date.now() - t0) / 1000 * 0.05);
        ring.style.strokeDashoffset = String(C * (1 - p)); pct.textContent = Math.round(p * 100) + '%';
      }, 120);
    })();
  </script>
  <div id="app"></div>
  <div id="hud" class="panel" hidden></div>
  <div id="prompt" class="panel" hidden></div>
  <div id="toast" class="panel" role="status" hidden></div>
  <div id="badge" class="panel">Local demo &middot; labeled objects are not final art</div>
  <div id="ui"></div>
  <div id="scene-controls" class="ftf-root ftf-scene-controls"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
