    :root { --ink: #e9efe9; --panel: rgba(20, 24, 22, 0.72); --amber: #d9a441; --muted: #a9b5ae;

    .pl-plate { transition: opacity var(--pl-dur-fast) linear; }
    /* Stacking inside #ui: nameplates 0 · world HUD 0 · play panels / help / context 2 · hub dock, reading card, cards 3 · hub fade 6.

    body.wh-on .ftf-scene-tools { display: none; } /* the hotbar's Settings and Esc open the same menu */
    /* Reserved regions with the world HUD (docs/ui-polish.md §2.4). Bottom centre, from the bottom up: hotbar row
       (23 u + ~56 px) · dialogue strip (lifted: +12 px) · context menu (+46 u + 12 px) · HUD prompt (top 618 u).

    /* Short viewports (in-app browsers; html[data-vh] from the world HUD): panels fit the visible height, buttons keep

        bottom: auto; top: max(44px, calc(8px + env(safe-area-inset-top, 0px))); width: 36px; height: 36px; }
      html[data-vh="short"] .ftf-run-toggle, html[data-vh="tiny"] .ftf-run-toggle { right: 112px; }
      html[data-vh="short"] .ftf-map-fab, html[data-vh="tiny"] .ftf-map-fab { left: 70px; }
      html[data-vh="short"] .ftf-run-toggle svg, html[data-vh="tiny"] .ftf-run-toggle svg { width: 22px; height: 22px; }
      html[data-vh="short"] :is(.ftf-run-toggle, .ftf-map-fab)::before, html[data-vh="tiny"] :is(.ftf-run-toggle, .ftf-map-fab)::before { content: ""; position: absolute; inset: -4px; border-radius: inherit; }
    }

    /* Phones: miniature HUD so the world stays visible (owner 07.11). */
    @media (max-width: 640px), (pointer: coarse) and (max-height: 900px) {
      .pl-goal { top: calc(6px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 132px)); left: auto; right: 8px; transform: none; padding: 5px 9px 6px; border-top-width: 2px; border-radius: 8px; }
      .pl-goal-head { font-size: 9px; } .pl-goal-title { font-size: 13px; margin: 2px 0; } .pl-goal-hint { display: none; }
      .pl-row { gap: 4px; margin-top: 3px; }
      .pl-btn { --pl-target: 48px; font-size: 14px; padding: 0 14px; } .pl-small { font-size: 13px; padding: 0 12px; }
      .pl-bar { left: 6px; right: 6px; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding: 4px; gap: 4px; max-width: none; justify-content: center; border-radius: 8px; }
      .pl-context { bottom: calc(46px + env(safe-area-inset-bottom, 0px)); min-width: 0; width: calc(100vw - 16px); padding: 5px 8px; }
      .pl-context h3 { font-size: 14px; margin-bottom: 4px; } .pl-opt { --pl-target: 48px; font-size: 13.5px; padding: 0 8px; }
      .pl-panel { top: auto; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); right: 8px; left: 8px; width: auto; max-height: calc(var(--vvh, 100vh) * .56); padding: 12px 14px 16px; font-size: 13px; }
      .pl-panel h2 { font-size: 17px; } .pl-panel h3 { font-size: 14px; } .pl-muted { font-size: 12px; }
      .pl-help { top: auto; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); left: 8px; width: calc(100vw - 16px); max-height: calc(var(--vvh, 100vh) * .56); overflow: auto; font-size: 12.5px; padding: 12px 14px; }
      /* a context menu on a phone is a sheet of choices: the tiles and the prompt step aside while it is open */
      body.pl-context-open .wh-root :is(.wh-tiles, .wh-prompt--mobile) { visibility: hidden; }
      .pl-info { bottom: calc(50px + env(safe-area-inset-bottom, 0px)); font-size: 12px; padding: 5px 10px; max-width: calc(100vw - 24px); }
      .pl-chronicle, .pl-badge, #badge, #prompt { display: none !important; }
      /* phones: a modal panel dims the HUD behind it (no extra DOM) and the run toggle steps aside */
      .pl-panel, .pl-help { box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .38), 0 10px 30px rgba(0, 0, 0, .42); }
      /* the phone HUD stack never shows under a modal panel (the Signs sheet already brings its own scrim) */
      body.pl-modal-open .wh-root :is(.wh-quest--mobile, .wh-quest__dots, .wh-trial--mobile, .wh-tiles, .wh-prompt--mobile, .wh-dialogue--mobile) { visibility: hidden; }
      body.in-world.pl-modal-open .ftf-run-toggle.ftf-run-toggle--on { display: none; } /* outranks input.js's display: flex */
      body.in-world.hub-in-shell .ftf-run-toggle.ftf-run-toggle--on { display: none; } /* no running inside a Shell: the reading card owns the screen */
      body.pl-modal-open .ftf-map-fab { display: none; } /* the map's own phone button steps aside under a modal panel too */
      #ui .ftf-hud-status { top: calc(6px + env(safe-area-inset-top, 0px)) !important; left: 6px !important; right: auto !important; width: 190px !important; min-width: 0 !important; grid-template-columns: 1fr !important; gap: 0 !important; padding: 8px 10px !important; transform: scale(.58); transform-origin: top left; }
      #toast { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); font-size: 12px; }
    }

<body class="booting">
  <div id="boot" role="status" aria-live="polite" aria-label="Loading">
    <div class="boot-inner">
      <svg class="boot-ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="boot-ring-bg" cx="60" cy="60" r="54"/>
        <circle class="boot-ring-ink" cx="60" cy="60" r="46"/>
        <circle class="boot-ring-fg" cx="60" cy="60" r="54"/>
        <circle class="boot-core" cx="60" cy="60" r="3.5"/>
      </svg>
      <h1 class="boot-title"><span>Forget</span><span>to Foresee</span></h1>
      <div class="boot-meta"><span class="boot-label">Loading the island</span><span class="boot-pct">4%</span></div>
    </div>
  </div>
  <script>
    // Before the module graph arrives: a slow trickle on the ring, so the first second is never a frozen bar.
    (function () {
      var ring = document.querySelector('#boot .boot-ring-fg'), pct = document.querySelector('#boot .boot-pct'), p = 0.04, C = 339.29, t0 = Date.now();
      window.__ftfBoot = { shown: function () { return p; }, stop: function () { clearInterval(id); } };
      var id = setInterval(function () {
        if (!document.getElementById('boot')) { clearInterval(id); return; }
        p = Math.min(0.3, 0.04 + (Date.now() - t0) / 1000 * 0.05);
        ring.style.strokeDashoffset = String(C * (1 - p)); pct.textContent = Math.round(p * 100) + '%';
      }, 120);
    })();
  </script>
  <div id="app"></div>
  <div id="hud" class="panel" hidden></div>
  <div id="prompt" class="panel" hidden></div>
  <div id="toast" class="panel" role="status" hidden></div>
  <div id="badge" class="panel">Local demo &middot; labeled objects are not final art</div>
  <div id="ui"></div>
  <div id="scene-controls" class="ftf-root ftf-scene-controls"></div>
  <script type="module" src="/src/main.js"></script>
</body>
