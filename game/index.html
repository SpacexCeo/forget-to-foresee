<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@300;400&display=swap">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forget to Foresee</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --ink: #e9efe9; --panel: rgba(20, 24, 22, 0.72); --amber: #d9a441; --muted: #a9b5ae;
      /* Play-layer surfaces follow the world HUD tokens (docs/ui-world-hud.md §2): opaque enough that nothing reads through. */
      --pl-panel: linear-gradient(180deg, rgba(11, 21, 23, .95) 0%, rgba(24, 34, 34, .94) 55%, rgba(36, 44, 41, .93) 100%);
      --pl-frame: rgba(232, 214, 172, .62); --pl-frame-soft: rgba(196, 186, 156, .4); --pl-gold: #e4c272; --pl-gold-text: #f6df9b; --pl-text: #faf7ee; --pl-text-2: #e6e3d7; --pl-muted: #c9c6b8;
      --pl-btn: rgba(10, 22, 23, .85); --pl-btn-hover: rgba(22, 36, 37, .95); --pl-primary: linear-gradient(180deg, #6f501b 0%, #5b4215 55%, #4a3410 100%);
      --pl-serif: "Libre Caslon Text", "WH Cyrillic", "Palatino Linotype", Palatino, Georgia, serif; --pl-sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      /* spacing scale 4 / 8 / 12 / 16 / 24; radii: buttons 10, panels 14, pills 999; targets 40 px (48 on phones) */
      --pl-r-btn: 10px; --pl-r-panel: 14px; --pl-target: 40px;
      --pl-u: clamp(0.6px, calc(100vw / 1811), 1.35px); /* the world HUD's unit (tokens.css --wh-px) for the play layer's reserved regions */ }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d3d0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); }
    #app, #app canvas { position: fixed; inset: 0; display: block; }
    .panel { position: fixed; background: var(--panel); border-radius: 8px; padding: 8px 12px; pointer-events: none; }
    #objective { position: fixed; top: 14px; left: 18px; max-width: calc(100% - 175px); font: 500 18px/1.3 Georgia, serif; pointer-events: none; }
    #scene-controls { z-index: 11; }
    body:not(.in-world) #scene-controls { display: none; }
    .ftf-scene-cue { bottom: 240px; }
    #hud { top: 48px; left: 12px; font: 12px/1.45 ui-monospace, Consolas, monospace; max-width: min(560px, calc(100vw - 48px)); }
    #hud .over { color: #ff8a7a; }
    #hud .assets { margin-top: 6px; columns: 2; column-gap: 18px; color: var(--muted); }
    #hud .st-loaded { color: #9fd89a; } #hud .st-loading { color: var(--amber); } #hud .st-failed { color: #ff8a7a; }
    #hud .events { margin-top: 6px; color: var(--muted); }
    #prompt { bottom: 200px; left: 50%; transform: translateX(-50%); font-size: 16px; white-space: nowrap; background: rgba(20, 24, 22, 0.45); }
    #prompt kbd { font-size: 14px; padding: 1px 7px; margin-right: 6px; }
    #toast { bottom: 76px; left: 50%; transform: translateX(-50%); color: var(--muted); }
    kbd { border: 1px solid #6c7a72; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, Consolas, monospace; color: var(--ink); }
    #badge { bottom: 12px; left: 12px; font-size: 12px; color: var(--muted); }
    body.in-world #badge { display: none; }
    /* Lobby/onboarding (src/ui) and the in-world UI share one overlay; in the world only panels take input. */
    #ui { position: fixed; inset: 0; z-index: 10; }
    body:not(.in-world) #ui { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; } /* lobby/onboarding pages taller than the screen scroll */
    body.in-world #ui { pointer-events: none; }
    /* World HUD (src/play/world-hud.js): it replaces the goal card, chronicle, action bar and the old status/subtitles;
       the play panels, context menu, help and info stay above it. ?hud=old keeps the greybox overlay. */
    .wh-host { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    body.wh-on .pl-goal, body.wh-on .pl-chronicle, body.wh-on .pl-bar, body.wh-on #ui .ftf-hud-status, body.wh-on #ui .ftf-subtitles { display: none !important; }
    /* Stacking inside #ui: nameplates 0 · world HUD 0 · play panels / help / context 2 · hub dock, reading card, cards 3 · hub fade 6.
       Only one of panel / help / Signs / card is open at a time (src/play/panels.js); the dock and the reading card hide under any of them. */
    body.wh-on .pl-panel, body.wh-on .pl-context, body.wh-on .pl-help, body.wh-on .pl-info { z-index: 2; }
    @media (max-width: 700px) { body.wh-on .pl-panel, body.wh-on .pl-help { z-index: 4; } } /* phones: above the hub dock and the reading card, which sit at the top */
    body.wh-on .pl-badge { top: auto; bottom: 8px; left: 16px; right: auto; max-width: min(340px, 26vw); z-index: 1; } /* clear of the centred dialogue strip at 1280 */
    body.wh-on .ftf-scene-tools { display: none; } /* the hotbar's Settings and Esc open the same menu */
    /* Reserved regions with the world HUD (docs/ui-polish.md §2.4). Bottom centre, from the bottom up: hotbar row
       (23 u + ~56 px) · dialogue strip (lifted: +12 px) · context menu (+46 u + 12 px) · HUD prompt (top 618 u).
       Top centre, under the quest banner (ends at 134 u): inspect hint at 152 u, then the transient row
       (status / info / toast) 48 px lower. */
    body.wh-on .ftf-scene-cue { bottom: 22vh; }
    body.wh-on #prompt { bottom: auto; top: calc(152 * var(--pl-u)); font-size: 13px; padding: 8px 14px; border-radius: 999px; background: rgba(12, 20, 21, .9); }
    body.wh-on #toast { bottom: auto; top: calc(152 * var(--pl-u) + 48px); border-radius: 999px; }
    body.wh-on .pl-context { bottom: calc(23 * var(--pl-u) + 60px + 12px + 46 * var(--pl-u) + 12px); }
    body.wh-on .pl-info { bottom: auto; top: calc(152 * var(--pl-u) + 48px); }
    @media (max-width: 700px) { body.wh-on .pl-badge { display: none; } }
    body.in-world #ui .ftf-hud-chronicle { display: none; } /* the play chronicle renders the room log (docs/collab-requests.md) */
    #ui .ftf-hud { position: fixed; inset: 0; pointer-events: none; }
    .pl-goal, .pl-context, .pl-panel, .pl-chronicle, .pl-help, .pl-bar, .pl-info, .pl-badge { position: fixed; pointer-events: auto; background: var(--panel); border-radius: var(--pl-r-panel); color: var(--ink); box-shadow: 0 6px 24px rgba(10, 14, 12, 0.35); }
    /* Modal surfaces: the HUD's panel gradient, hairline frame and blur; the scene never shows through text. */
    /* The gradient sits on a solid base colour: a modal panel over the 3D scene is fully opaque (no blur needed, cheaper on phones). */
    .pl-panel, .pl-context, .pl-help, .pl-info { background: var(--pl-panel) #121d1f; border: 1px solid var(--pl-frame); color: var(--pl-text); font-family: var(--pl-sans); box-shadow: 0 10px 30px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .06); }
    @media (pointer: coarse) { .pl-panel header .pl-btn kbd { display: none; } } /* no Esc key on a phone */
    .pl-goal { top: 14px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 10px 16px 12px; border-top: 3px solid var(--amber); }
    .pl-goal-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .pl-goal-title { margin: 4px 0 2px; font: 600 19px/1.3 Georgia, 'Times New Roman', serif; color: #f6efdc; }
    .pl-goal-hint { margin: 0 0 6px; font-size: 13px; color: #cdd6d0; }
    .pl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .pl-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--pl-target); padding: 0 16px; font: 500 14px/1.2 var(--pl-sans); color: var(--pl-text); background: var(--pl-btn); border: 1px solid rgba(232, 214, 172, .45); border-radius: var(--pl-r-btn); cursor: pointer; transition: border-color .16s ease, background-color .16s ease, transform .08s ease; }
    .pl-btn:hover { border-color: var(--pl-gold); background: var(--pl-btn-hover); } .pl-btn:active { transform: translateY(1px); }
    .pl-btn:focus-visible, .pl-opt:focus-visible { outline: 2px solid #fbe6a6; outline-offset: 2px; }
    .pl-btn[disabled] { opacity: 0.45; cursor: default; transform: none; }
    .pl-btn kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid rgba(232, 214, 172, .6); border-radius: 4px; background: rgba(42, 38, 30, .92); color: #fef4e6; font: 500 11px/1 var(--pl-sans); }
    .pl-primary { background: var(--pl-primary); border-color: var(--pl-gold); color: #fffcec; } .pl-primary:hover { filter: brightness(1.08); }
    .pl-small { padding: 0 12px; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { .pl-btn { transition: none; } }
    .pl-context { bottom: 74px; left: 50%; transform: translateX(-50%); padding: 12px 12px 12px 16px; min-width: 320px; max-width: min(620px, calc(100vw - 32px)); }
    .pl-context h3 { margin: 0 0 8px; font: 400 16px/1.2 var(--pl-serif); color: var(--pl-text); -webkit-text-stroke: .2px currentColor; }
    .pl-context ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .pl-opt { display: flex; gap: 10px; align-items: center; width: 100%; min-height: var(--pl-target); text-align: left; background: none; border: 0; color: var(--pl-text); font: 500 14px/1.3 var(--pl-sans); padding: 0 10px; border-radius: var(--pl-r-btn); cursor: pointer; transition: background-color .16s ease; }
    .pl-opt kbd { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 4px; }
    .pl-opt:hover, .pl-default { background: rgba(228, 194, 114, 0.16); }
    .pl-default kbd { border-color: var(--pl-gold); color: var(--pl-gold); }
    .pl-off { opacity: 0.55; } .pl-off small { color: #ffb4a8; }
    .pl-panel { top: 120px; right: 16px; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 220px); overflow: auto; padding: 16px 20px 20px; font-size: 14px; line-height: 1.4; scrollbar-width: thin; scrollbar-color: #b48d3c transparent; }
    .pl-panel header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .pl-panel p { margin: 8px 0 0; color: var(--pl-text-2); }
    .pl-panel h2 { margin: 0; font: 400 20px/1.2 var(--pl-serif); color: var(--pl-text); -webkit-text-stroke: .3px currentColor; text-shadow: 0 0 8px rgba(255, 236, 190, .22); } .pl-panel h3 { font: 400 15px/1.2 var(--pl-serif); color: var(--pl-text); margin: 16px 0 4px; -webkit-text-stroke: .2px currentColor; }
    .pl-list { list-style: none; padding: 0; margin: 12px 0 0; } .pl-list > li { padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, 0.12); } .pl-list > li:first-child { border-top: 0; padding-top: 4px; }
    .pl-list b { font: 400 15px/1.3 var(--pl-serif); color: var(--pl-text); -webkit-text-stroke: .2px currentColor; }
    .pl-mem-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .pl-muted { color: var(--pl-muted); font-size: 13px; } .pl-strong { color: var(--pl-gold-text); font-weight: 600; }
    .pl-sign { display: grid; grid-template-columns: 112px 1fr; gap: 12px; } .pl-sign canvas { border-radius: 50%; }
    .pl-slots { margin: 4px 0; padding-left: 16px; font-size: 13px; line-height: 1.5; }
    .pl-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border: 1px solid rgba(214, 206, 180, .62); border-radius: 999px; background: rgba(20, 26, 24, .7); color: var(--pl-gold-text); font-size: 11.5px; letter-spacing: .02em; vertical-align: middle; }
    .pl-pick { margin: 12px 0 0; } .pl-pick > span { font-size: 12px; color: var(--pl-muted); text-transform: uppercase; letter-spacing: .08em; }
    .pl-chronicle { left: 12px; bottom: 12px; width: min(380px, calc(100vw - 32px)); margin: 0; padding: 8px 10px; list-style: none; font-size: 12px; max-height: 180px; overflow: hidden; }
    .pl-chronicle li { display: flex; gap: 6px; padding: 1px 0; } .pl-chronicle .pl-t { color: var(--muted); min-width: 16px; text-align: right; }
    .pl-chronicle [data-tone=good] .pl-glyph { color: #9fd89a; } .pl-chronicle [data-tone=bad] .pl-glyph { color: #ff8a7a; } .pl-chronicle [data-tone=key] .pl-glyph { color: var(--amber); }
    .pl-bar { right: 12px; bottom: 12px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 420px); }
    .pl-help { top: 120px; right: 16px; width: min(400px, calc(100vw - 32px)); max-height: calc(100vh - 220px); overflow: auto; padding: 16px 20px; font-size: 13.5px; line-height: 1.45; } /* the right column is the panel column (the left holds the trial card and the log) */ .pl-help p { margin: 6px 0 0; color: var(--pl-text-2); } .pl-help h3 { margin: 0 0 4px; font: 400 18px/1.2 var(--pl-serif); -webkit-text-stroke: .3px currentColor; }
    .pl-help kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid rgba(232, 214, 172, .6); border-radius: 4px; background: rgba(42, 38, 30, .92); color: #fef4e6; font: 500 11px/1 var(--pl-sans); }
    .pl-info { bottom: 180px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px; font-size: 14px; }
    .pl-badge { top: 14px; right: 12px; max-width: 250px; padding: 6px 12px; font-size: 11.5px; line-height: 1.35; color: var(--muted); background: rgba(20, 24, 22, 0.5); }
    @media (max-width: 900px) { .pl-bar { max-width: none; left: 12px; } .pl-chronicle { display: none; } .pl-badge { display: none; } }

    /* Phones: miniature HUD so the world stays visible (owner 07.11). */
    @media (max-width: 640px), (pointer: coarse) and (max-height: 900px) {
      .pl-goal { top: calc(6px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 132px)); left: auto; right: 8px; transform: none; padding: 5px 9px 6px; border-top-width: 2px; border-radius: 8px; }
      .pl-goal-head { font-size: 9px; } .pl-goal-title { font-size: 13px; margin: 2px 0; } .pl-goal-hint { display: none; }
      .pl-row { gap: 4px; margin-top: 3px; }
      .pl-btn { --pl-target: 48px; font-size: 14px; padding: 0 14px; } .pl-small { font-size: 13px; padding: 0 12px; }
      .pl-bar { left: 6px; right: 6px; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding: 4px; gap: 4px; max-width: none; justify-content: center; border-radius: 8px; }
      .pl-context { bottom: calc(46px + env(safe-area-inset-bottom, 0px)); min-width: 0; width: calc(100vw - 16px); padding: 5px 8px; }
      .pl-context h3 { font-size: 14px; margin-bottom: 4px; } .pl-opt { --pl-target: 48px; font-size: 13.5px; padding: 0 8px; }
      .pl-panel { top: auto; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); right: 8px; left: 8px; width: auto; max-height: 56vh; padding: 12px 14px 16px; font-size: 13px; }
      .pl-panel h2 { font-size: 17px; } .pl-panel h3 { font-size: 14px; } .pl-muted { font-size: 12px; }
      .pl-help { top: auto; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); left: 8px; width: calc(100vw - 16px); font-size: 12.5px; padding: 12px 14px; }
      .pl-info { bottom: calc(50px + env(safe-area-inset-bottom, 0px)); font-size: 12px; padding: 5px 10px; max-width: calc(100vw - 24px); }
      .pl-chronicle, .pl-badge, #badge, #prompt { display: none !important; }
      /* phones: a modal panel dims the HUD behind it (no extra DOM) and the run toggle steps aside */
      .pl-panel, .pl-help { box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .38), 0 10px 30px rgba(0, 0, 0, .42); }
      body.in-world.pl-modal-open .ftf-run-toggle.ftf-run-toggle--on { display: none; } /* outranks input.js's display: flex */
      #ui .ftf-hud-status { top: calc(6px + env(safe-area-inset-top, 0px)) !important; left: 6px !important; right: auto !important; width: 190px !important; min-width: 0 !important; grid-template-columns: 1fr !important; gap: 0 !important; padding: 8px 10px !important; transform: scale(.58); transform-origin: top left; }
      #toast { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud" class="panel" hidden></div>
  <div id="prompt" class="panel" hidden></div>
  <div id="toast" class="panel" role="status" hidden></div>
  <div id="badge" class="panel">Local demo &middot; labeled objects are not final art</div>
  <div id="ui"></div>
  <div id="scene-controls" class="ftf-root ftf-scene-controls"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
