# Drop-in for BOTH services (ftf-relayer.service.d/db.conf and ftf-presence.service.d/db.conf): the shared database.
# The services run as different dynamic users, so the file is shared through the group ftf-db: the folder is
# root:ftf-db mode 2770 (setgid: new files get the group), the umask keeps the database and its -wal / -shm files
# group-writable.
[Service]
Environment=FTF_DB=/var/lib/ftf-db/ftf.sqlite
SupplementaryGroups=ftf-db
ReadWritePaths=/var/lib/ftf-db
UMask=0007
